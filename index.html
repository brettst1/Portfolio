<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brett Stone — Geospatial &amp; Intelligence Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --bg-void: #050608;
      --bg-surface: #0b0d11;
      --bg-elevated: #11151c;
      --border: rgba(255, 255, 255, 0.09);
      --border-strong: rgba(255, 255, 255, 0.18);
      --text-primary: #f4f6f9;
      --text-secondary: #9aa3b2;
      --text-muted: #687182;
      --accent: #e5e9f0;
      --accent-subtle: rgba(255, 255, 255, 0.06);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --max-w: 1080px;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-void);
      color: var(--text-primary);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .wrap {
      max-width: var(--max-w);
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    /* Top bar */
    header.site-nav {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(5, 6, 8, 0.84);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      min-height: 60px;
    }

    .brand {
      font-size: 0.92rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text-primary);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      font-size: 0.86rem;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .nav-links a:hover {
      color: var(--text-primary);
    }

    /* Hero section */
    .hero {
      padding: 3.5rem 0 2.5rem;
      border-bottom: 1px solid var(--border);
    }

    .hero-grid {
      display: flex;
      align-items: flex-start;
      gap: 1.75rem;
      flex-wrap: wrap;
    }

    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 999px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-strong);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .avatar-initials {
      font-size: 1.45rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--text-secondary);
    }

    .hero-content {
      flex: 1;
      min-width: 260px;
    }

    .kicker {
      font-size: 0.76rem;
      font-weight: 600;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.55rem;
    }

    h1 {
      font-size: clamp(1.9rem, 3.6vw, 2.65rem);
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1.15;
      margin-bottom: 0.9rem;
    }

    .bio {
      color: var(--text-secondary);
      font-size: 0.98rem;
      max-width: 68ch;
      margin-bottom: 1.5rem;
    }

    .cta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.58rem 1rem;
      border-radius: var(--radius-sm);
      font-size: 0.86rem;
      font-weight: 500;
      border: 1px solid var(--border-strong);
      background: var(--bg-surface);
      color: var(--text-primary);
      transition: background 0.16s ease, border-color 0.16s ease;
    }

    .btn:hover {
      background: var(--bg-elevated);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .btn-primary {
      background: var(--text-primary);
      color: var(--bg-void);
      border-color: var(--text-primary);
      font-weight: 600;
    }

    .btn-primary:hover {
      background: #dfe4ec;
      border-color: #dfe4ec;
    }

    /* Sections */
    section {
      padding: 3rem 0;
      border-bottom: 1px solid var(--border);
    }

    .section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 1.75rem;
      gap: 1rem;
    }

    h2 {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .section-note {
      font-size: 0.84rem;
      color: var(--text-muted);
    }

    /* Portfolio grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.25rem;
    }

    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: border-color 0.18s ease, transform 0.18s ease;
    }

    .card:hover {
      border-color: var(--border-strong);
      transform: translateY(-2px);
    }

    .thumb {
      display: block;
      aspect-ratio: 16 / 10;
      background: var(--bg-elevated);
      border-bottom: 1px solid var(--border);
      overflow: hidden;
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .doc-tile {
      width: 100%;
      height: 100%;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: linear-gradient(180deg, #10141c 0%, #090b0f 100%);
    }

    .doc-type {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .doc-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.35;
    }

    .card-body {
      padding: 1.15rem 1.25rem 1.3rem;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .meta-tag {
      font-size: 0.76rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 0.35rem;
    }

    .card h3 {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin-bottom: 0.45rem;
    }

    .card p {
      font-size: 0.89rem;
      color: var(--text-secondary);
      margin-bottom: 1.1rem;
      flex: 1;
    }

    .card-link {
      font-size: 0.84rem;
      font-weight: 500;
      color: var(--text-primary);
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }

    .card-link:hover {
      color: var(--text-secondary);
    }

    /* Resume panel */
    .panel {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 1.5rem 1.75rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1.25rem;
    }

    .panel h3 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 0.3rem;
    }

    .
